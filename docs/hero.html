<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:640px;overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
 background:radial-gradient(circle at 85% 20%,#dbeafe 0,transparent 45%),radial-gradient(circle at 10% 100%,#e0e7ff 0,transparent 40%),#f8fafc;position:relative}
.dots{position:absolute;inset:0;background-image:radial-gradient(#cbd5e1 1px,transparent 1px);background-size:22px 22px;opacity:.5}
.left{position:absolute;left:72px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{display:inline-flex;align-self:flex-start;gap:8px;align-items:center;background:#fff;border:1px solid #bfdbfe;color:#1d4ed8;font-weight:700;font-size:15px;padding:7px 14px;border-radius:999px;letter-spacing:.02em}
h1{font-size:68px;line-height:1.02;color:#1e40af;font-weight:800;letter-spacing:-.02em;margin-top:22px}
h1 span{color:#d97706}
p{font-size:23px;line-height:1.45;color:#374151;margin-top:22px;max-width:520px}
.chips{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
.chip{background:#dbeafe;color:#1d4ed8;font-weight:700;font-size:16px;padding:9px 16px;border-radius:999px}
.chip.g{background:#dcfce7;color:#15803d}.chip.a{background:#fef3c7;color:#b45309}
.sheet{position:absolute;width:380px;border-radius:6px;box-shadow:0 30px 60px -15px rgba(30,64,175,.35),0 0 0 1px rgba(15,23,42,.06);background:#fff}
.s1{right:250px;top:110px;transform:rotate(-7deg)}
.s2{right:60px;top:60px;transform:rotate(4deg);width:400px}
.paste{position:absolute;right:390px;bottom:38px;width:350px;background:#0f172a;color:#cbd5e1;font:13px/1.55 ui-monospace,Menlo,monospace;padding:14px 16px;border-radius:10px;box-shadow:0 20px 40px -12px rgba(15,23,42,.5);transform:rotate(-2deg)}
.paste b{color:#93c5fd;font-weight:600}.paste i{color:#fcd34d;font-style:normal}
.arrow{position:absolute;right:330px;bottom:120px;font-size:44px;color:#d97706;font-weight:800;transform:rotate(-20deg)}
</style></head><body><div class="dots"></div>
<div class="left">
 <div class="eyebrow">✏️ Worksheet generator</div>
 <h1>Daily Creative<br><span>Spark</span></h1>
 <p>Paste a day's writing prompt. Get a print-ready A4 worksheet PDF in one click.</p>
 <div class="chips"><span class="chip">Flask web app</span><span class="chip g">Docker &amp; Synology</span><span class="chip a">CLI included</span></div>
</div>
<img class="sheet s1" src="screenshots/worksheet-day3.png"><img class="sheet s2" src="screenshots/worksheet-day2.png">
<div class="paste"><b>Day 2 (Tuesday)</b>: Sensory<br>* Topic: The Busy Rainy Afternoon<br>* Word Vault: <i>`pattered`</i>, <i>`gloomy`</i>…</div>
</body></html>
